<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oslí můstek</title>
<meta name="description" content="Angličtina od A2 po C2 přes české zvukové můstky: obrázek, výslovnost, příběh a psaní.">
<meta name="theme-color" content="#2B44D6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one centered column (max 560px), one card at a time, like flipping through a vocabulary notebook with a yellow highlighter */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#151C36; --muted:#5A6482; --line:#DDE2EC;
  --accent:#2B44D6; --accent-ink:#FFFFFF; --accent-soft:#E4E8FC;
  --mark:#FFE14D; --mark-ink:#151C36;
  --good:#167F4F; --good-soft:#DDF3E7; --bad:#C2372E; --bad-soft:#FBE3E1; --learn:#E0A21B;
  --tile-s:78%; --tile-l:90%;
  --shadow:0 1px 2px rgba(21,28,54,.06), 0 10px 28px rgba(21,28,54,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ipa:"Segoe UI","Noto Sans","DejaVu Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0E1222; --surface:#171D33; --ink:#E8EBF6; --muted:#9AA3C2; --line:#283052;
  --accent:#8E9DFF; --accent-ink:#0E1222; --accent-soft:#232C55;
  --mark:#F5CF3A; --mark-ink:#151515;
  --good:#4CCB8E; --good-soft:#163A2A; --bad:#FF7B70; --bad-soft:#41201F; --learn:#E8B33E;
  --tile-s:34%; --tile-l:22%;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:6px}
.brand p{color:var(--muted);font-size:15px;margin-top:4px}
.streak{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.streak b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);line-height:1}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--good)}
.sync.err i{background:var(--bad)}
.sync.wait i{background:var(--learn)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:transform .08s ease;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px;border-radius:12px}
.icon{width:22px;height:22px;flex:none}
.say{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.say.slow{background:var(--accent-soft);color:var(--ink);width:44px;height:44px}
.say.tiny{width:36px;height:36px;background:var(--accent-soft);color:var(--ink)}
.say.tiny .icon{width:18px;height:18px}

.levels{display:flex;flex-direction:column;gap:8px}
.lvl{appearance:none;border:0;background:transparent;padding:6px 0;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;cursor:pointer;text-align:left;border-radius:10px}
.lvl .lv{font-family:var(--f-display);font-weight:800;font-size:20px}
.lvl .lbar{height:12px;border-radius:7px;background:var(--line);overflow:hidden;display:flex}
.lvl .lbar i{display:block;height:100%}
.lvl .lbar .k{background:var(--good)}
.lvl .lbar .l{background:var(--learn)}
.lvl .lnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl .goal{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.lesson h2{font-size:24px}
.senses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sense{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-align:center}
.sense svg{width:26px;height:26px;color:var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.word{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.word .em{font-size:26px;line-height:1;background:hsl(var(--h) var(--tile-s) var(--tile-l));border-radius:10px;padding:8px;align-self:flex-start}
.word .lt{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:var(--muted)}
.word b{font-family:var(--f-display);font-size:19px;overflow-wrap:anywhere}
.word span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--good)}

.scene{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;background:hsl(var(--h) var(--tile-s) var(--tile-l));display:grid;place-items:center;overflow:hidden}
.scene .em{font-size:clamp(64px,20vw,108px);line-height:1;letter-spacing:.05em;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.scene .tag{position:absolute;top:10px;left:12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.headword{display:flex;align-items:center;gap:12px;justify-content:space-between}
.headword h2{font-size:clamp(34px,11vw,56px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0}
.pron{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;color:var(--muted)}
.ipa{font-family:var(--f-ipa);font-size:18px;color:var(--ink)}
.meaning{font-size:22px}
.meaning b{font-family:var(--f-display)}
.bridge{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.sound{font-size:17px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sound .arrow{color:var(--muted)}
.sound .enw{font-family:var(--f-display);font-weight:700}
.story{font-size:19px;line-height:1.6}
mark.k{background:var(--mark);color:var(--mark-ink);padding:0 .2em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:700}
strong.m{color:var(--accent);font-weight:700}
.tip{font-size:14px;color:var(--muted);font-style:italic}
.example{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.example div{min-width:0}
.example .en{font-weight:700}
.example .cz{color:var(--muted);font-size:15px}
.write{display:flex;flex-direction:column;gap:8px}
.field{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:20px;min-height:52px}
select.field{font-size:17px}
.field.ok{border-color:var(--good);background:var(--good-soft)}
.field.bad{border-color:var(--bad)}
textarea.field{font-size:17px;min-height:90px;resize:vertical}

.topbar{display:flex;align-items:center;gap:12px}
.x{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s ease}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{font-size:15px;color:var(--muted)}
.prompt-word{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.15}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 10px;font-size:18px;font-weight:700;cursor:pointer;min-height:64px;overflow-wrap:anywhere}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback h3{font-size:22px}
.feedback.ok h3{color:var(--good)}
.feedback.no h3{color:var(--bad)}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.listen .say{width:96px;height:96px}
.listen .say .icon{width:40px;height:40px}

.sum{text-align:center;align-items:center}
.sum h2{font-size:32px}
.sum .big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.form small{font-weight:400;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.settings{display:flex;flex-direction:column;gap:14px}
.settings .row{justify-content:space-between}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:20;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading"><p>Načítám slovíčka…</p></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
